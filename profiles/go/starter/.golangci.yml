# golangci-lint v2. Copy to the repository root and set the module path below.
# Never weaken this file to get a pass; fix the code or record a decision.
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - nolintlint
    - unconvert
    - unparam
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - <module path>
