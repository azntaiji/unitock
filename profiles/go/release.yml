# Release kit (optional). Copy to .github/workflows/release.yml.
# Publishes a GitHub Release for every vX.Y.Z tag the agent pushes at gate close.
# Action versions were current majors in late 2026; bump them when newer majors exist.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check
        run: make check
      - name: Release
        run: make release VERSION="${GITHUB_REF_NAME#v}" NOTES="$RUNNER_TEMP/notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
