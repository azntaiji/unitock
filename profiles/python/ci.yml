# Copy to .github/workflows/ci.yml
# Action versions were current majors in late 2026; bump them when newer majors exist.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x" # pin to the project's supported version
          cache: pip
      - name: Setup
        run: python -m venv .venv && .venv/bin/python -m pip install -e ".[dev]"
      - name: Format check
        run: .venv/bin/python -m ruff format --check .
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Typecheck
        run: .venv/bin/python -m mypy src
      - name: Test
        run: .venv/bin/python -m pytest -q
