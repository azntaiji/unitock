# Enforces gate ordering, context budgets, and version consistency.
# Action versions were current majors in late 2026; bump them when newer majors exist.
name: scaffold-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # tags, for the tag check
      - name: Scaffold check
        run: python3 scripts/check_scaffold.py
      - name: Scaffold check self-tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
