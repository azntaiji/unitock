# Release kit.
# Publishes a GitHub Release for every vX.Y.Z tag the agent pushes at gate close.
# Action versions were current majors in late 2026; bump them when newer majors exist.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Not go-version-file: that installs go.mod's minimum (1.26.0) with
      # GOTOOLCHAIN=local, and GoReleaser (pinned in the Makefile) needs Go >= 1.27.3.
      # Keep this at or above GoReleaser's minimum when bumping it.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - name: Check
        run: make check
      - name: Release
        run: make release VERSION="${GITHUB_REF_NAME#v}" NOTES="$RUNNER_TEMP/notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
