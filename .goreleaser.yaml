# Release kit (optional).
# `make release-check` validates it and builds a snapshot into dist/; the release
# workflow publishes on every vX.Y.Z tag. Release notes come from CHANGELOG.md.
version: 2

project_name: unitock

builds:
  - main: ./cmd/unitock
    binary: unitock
    env:
      - CGO_ENABLED=0 # static binaries; cross-compiling needs no C toolchain
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.CommitDate}}
    mod_timestamp: "{{.CommitTimestamp}}"

archives:
  - formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    files: [README.md, LICENSE*, CHANGELOG.md]

checksum:
  name_template: checksums.txt

# Keep the changelog step enabled: it is where --release-notes (the CHANGELOG.md
# section from `make release-notes`) is loaded. Disabled, the release body is empty.
changelog:
  disable: false

release:
  github:
    owner: azntaiji
    name: unitock
  prerelease: auto
